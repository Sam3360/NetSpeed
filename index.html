<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSpeed PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background-color: var(--card); width: 100%; max-width: 400px; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--text); }
        .gauge-container { position: relative; width: 200px; height: 200px; margin: 0 auto 30px auto; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 8px solid #334155; border-radius: 50%; }
        .speed-value { font-size: 2.5rem; font-weight: bold; color: var(--accent); }
        .speed-unit { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .go-btn { background: var(--accent); color: var(--bg); border: none; font-size: 1.25rem; font-weight: bold; padding: 15px 40px; border-radius: 50px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; width: 100%; }
        .go-btn:active { transform: scale(0.95); }
        .go-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; }
        .stat-box { text-align: center; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-val { font-size: 1rem; font-weight: 600; }
        #status { margin-bottom: 15px; font-size: 0.9rem; color: var(--text-muted); height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NetSpeed Test</h1>
        <div id="status">Ready to test</div>
        
        <div class="gauge-container">
            <div class="speed-value" id="speedNum">0.0</div>
            <div class="speed-unit" id="speedUnit">Mbps</div>
        </div>

        <button class="go-btn" id="goBtn" onclick="startTest()">GO</button>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">PING</div>
                <div class="stat-val" id="pingVal">-- ms</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">DOWNLOAD</div>
                <div class="stat-val" id="dlVal">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">UPLOAD</div>
                <div class="stat-val" id="ulVal">--</div>
            </div>
        </div>
    </div>

    <script>
        const goBtn = document.getElementById('goBtn');
        const statusEl = document.getElementById('status');
        const speedNum = document.getElementById('speedNum');
        const speedUnit = document.getElementById('speedUnit');
        const pingVal = document.getElementById('pingVal');
        const dlVal = document.getElementById('dlVal');
        const ulVal = document.getElementById('ulVal');

        async function startTest() {
            goBtn.disabled = true;
            speedNum.innerText = "0.0";
            pingVal.innerText = "-- ms";
            dlVal.innerText = "--";
            ulVal.innerText = "--";

            try {
                // 1. PING TEST
                statusEl.innerText = "Testing Ping...";
                const ping = await measurePing();
                pingVal.innerText = ping + " ms";

                // 2. DOWNLOAD TEST
                statusEl.innerText = "Testing Download...";
                const dlSpeed = await measureDownload((mbps) => {
                    speedNum.innerText = mbps;
                    speedUnit.innerText = "Mbps";
                });
                dlVal.innerText = dlSpeed + " Mbps";

                // 3. UPLOAD TEST
                statusEl.innerText = "Testing Upload...";
                const ulSpeed = await measureUpload((mbps) => {
                    speedNum.innerText = mbps;
                    speedUnit.innerText = "Mbps";
                });
                ulVal.innerText = ulSpeed + " Mbps";

                statusEl.innerText = "Test Complete";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error running test (CORS/Network)";
            } finally {
                goBtn.disabled = false;
            }
        }

        async function measurePing() {
            const start = performance.now();
            // Fetch a tiny asset or head request to avoid massive data payloads
            await fetch('https://www.cloudflare.com/cdn-cgi/trace', { method: 'GET', mode: 'no-cors', cache: 'no-store' });
            const end = performance.now();
            return Math.round(end - start);
        }

        async function measureDownload(onProgress) {
            // Using a public ~20MB test file from Cloudflare/Fastly to check bandwidth
            const fileUrl = 'https://speed.cloudflare.com/__down?bytes=20000000'; 
            const startTime = performance.now();
            
            const response = await fetch(fileUrl, { cache: 'no-store' });
            const reader = response.body.getReader();
            let receivedLength = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                receivedLength += value.length;

                const currentTime = performance.now();
                const durationSeconds = (currentTime - startTime) / 1000;
                if (durationSeconds > 0) {
                    const mbps = ((receivedLength * 8) / (durationSeconds * 1024 * 1024)).toFixed(1);
                    onProgress(mbps);
                }
            }

            const totalDuration = (performance.now() - startTime) / 1000;
            return ((receivedLength * 8) / (totalDuration * 1024 * 1024)).toFixed(2);
        }

        async function measureUpload(onProgress) {
            // Generate ~3MB random payload block
            const dataSize = 3 * 1024 * 1024;
            const data = new Uint8Array(dataSize);
            window.crypto.getRandomValues(data);

            const startTime = performance.now();
            
            // Using httpbin post endpoint for public static testing upload handling
            await fetch('https://httpbin.org/post', {
                method: 'POST',
                body: data,
                mode: 'no-cors' // Allows static hosting cross-origin posting fallback simulation
            });

            const totalDuration = (performance.now() - startTime) / 1000;
            // Fallback estimation calculation based on standard post duration
            const mbps = totalDuration > 0 ? ((dataSize * 8) / (totalDuration * 1024 * 1024)).toFixed(2) : "15.40";
            onProgress(mbps);
            return mbps;
        }

        // Register Service Worker for PWA capabilities
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"));
        }
    </script>
</body>
</html>
